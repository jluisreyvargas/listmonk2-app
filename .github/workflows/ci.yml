name: ci

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write
  security-events: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/listmonk2

  # Repo GitOps a actualizar (owner/repo)
  GITOPS_REPO: jluisreyvargas/listmonk2-gitops

  # Path dentro de repo-gitops donde está el kustomization del entorno a desplegar
  GITOPS_KUSTOMIZE_PATH: apps/listmonk/overlays/local

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck entrypoint.sh

      - name: Hadolint
        run: |
          docker run --rm -i hadolint/hadolint < Dockerfile

  build_scan_and_push:
    needs: [lint]
    runs-on: ubuntu-latest

    outputs:
      deploy_image_ref: ${{ steps.deploy.outputs.deploy_image_ref }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=sha-
            type=ref,event=tag

      # Elegimos qué tag se va a “declarar” en GitOps:
      # - Si es push de tag v*, usamos ese tag
      # - Si es push a main, usamos sha-xxxx
      - name: Select deploy image ref
        id: deploy
        shell: bash
        run: |
          set -euo pipefail

          TAGS="${{ steps.meta.outputs.tags }}"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Buscar la línea exacta del tag (ej: ghcr.io/owner/listmonk2:v1.2.3)
            DEPLOY_REF="$(echo "$TAGS" | grep -E ":${GITHUB_REF_NAME}$" | head -n 1 || true)"
            if [[ -z "$DEPLOY_REF" ]]; then
              # Fallback al primero si no lo encuentra (raro)
              DEPLOY_REF="$(echo "$TAGS" | head -n 1)"
            fi
          else
            # Preferir sha-*
            DEPLOY_REF="$(echo "$TAGS" | grep -E ":sha-" | head -n 1)"
          fi

          echo "deploy_image_ref=$DEPLOY_REF" >> "$GITHUB_OUTPUT"
          echo "Deploy image ref: $DEPLOY_REF"

      # Build local para escaneo (sin push)
      - name: Build image (local for scan)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trivy SARIF (no falla) + upload a Code Scanning
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.deploy.outputs.deploy_image_ref }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # Trivy gating (TEMP non-blocking): genera reporte pero no rompe el pipeline
      # Trivy findings (last run on 2026-02-04):
      # - TODO: pega aquí 2-3 CVEs representativos del último run (CRITICAL/HIGH)
      # Notes:
      # - Root cause likely base image / libs (alpine/ssl) o paquetes desactualizados.
      # - Plan: actualizar base image / runtime (distroless) y volver a activar el gating estricto.
      - name: Trivy scan (H/H-C gating report, non-blocking)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: ${{ steps.deploy.outputs.deploy_image_ref }}
          format: table
          output: trivy-report.txt
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "1"
          skip-setup-trivy: true

      - name: Publish Trivy report to job summary
        if: always()
        shell: bash
        run: |
          echo "### Trivy report (CRITICAL/HIGH) — non-blocking" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f trivy-report.txt ]]; then
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat trivy-report.txt >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_No trivy-report.txt generated._" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Trivy report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn

      # Push final (solo en push main / tags)
      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update_gitops:
    # Solo actualizar GitOps cuando se pushea a main o tag (no PR)
    if: github.event_name != 'pull_request'
    needs: [build_scan_and_push]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.GITOPS_REPO }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops

      - name: Install kustomize
        shell: bash
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION="5.4.1"
          curl -fsSL -o /tmp/kustomize.tgz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/kustomize.tgz -C /tmp
          sudo install -m 0755 /tmp/kustomize /usr/local/bin/kustomize
          kustomize version

      - name: Update image in kustomization.yaml (GitOps)
        shell: bash
        run: |
          set -euo pipefail

          DEPLOY_REF="${{ needs.build_scan_and_push.outputs.deploy_image_ref }}"
          cd "gitops/${{ env.GITOPS_KUSTOMIZE_PATH }}"

          echo "Updating image to: $DEPLOY_REF"
          echo "Repo path: $(pwd)"

          # kustomize edit (sin contenedor)
          kustomize edit set image "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}=$DEPLOY_REF"

          echo "Resulting kustomization.yaml:"
          sed -n '1,200p' kustomization.yaml

      - name: Commit & push changes to GitOps
        shell: bash
        run: |
          set -euo pipefail
          cd gitops

          git config user.name "ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"

          git add -A

          # Si no hay cambios (ej. mismo tag), no fallar
          git commit -m "chore(gitops): bump listmonk2 to ${{ needs.build_scan_and_push.outputs.deploy_image_ref }}" || exit 0
          git push
